<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI chat</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>AI chat</h1>
        <p>Enter a prompt, pick a model, and submit.</p>
      </header>

      <form id="chat-form" class="panel">
        <label class="field">
          <span>Model</span>
          <select id="model" name="model">
            <option value="claude-opus-5" selected>claude-opus-5</option>
            <option value="claude-opus-5-thinking">claude-opus-5-thinking</option>
          </select>
        </label>

        <label class="field">
          <span>Prompt</span>
          <textarea
            id="content"
            name="content"
            rows="6"
            placeholder="Say hello in one sentence."
            required
          ></textarea>
        </label>

        <button type="submit" id="submit-btn">Submit</button>
      </form>

      <section class="panel result" aria-live="polite">
        <h2>Response</h2>
        <p id="status" class="status" hidden></p>
        <pre id="response" class="response empty">Waiting for a response.</pre>
        <button type="button" id="download-btn" class="secondary" hidden>
          Download
        </button>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
